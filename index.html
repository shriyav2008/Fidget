<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Interactive Fidget Website</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Fidget Toys</h1>

      <div class="toys-grid">
        <!-- Spinner -->
        <div class="fidget-item">
          <h2>Spinner</h2>
          <div class="spinner" id="spinner"></div>
        </div>

        <!-- Pop It -->
        <div class="fidget-item">
          <h2>Pop It</h2>
          <div class="pop-it" id="popIt"></div>
        </div>

        <!-- Bubble Wrap -->
        <div class="fidget-item">
          <h2>Bubble Wrap</h2>
          <div class="bubble-wrap" id="bubbleWrap"></div>
        </div>

        <!-- Clicker -->
        <div class="fidget-item">
          <h2>Clicker</h2>
          <div class="clicker" id="clicker"></div>
          <p>Clicks: <span id="clickCount">0</span></p>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
