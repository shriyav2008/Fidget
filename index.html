<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fidget Toys</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Arial", sans-serif;
        background-image: url("background.jpg");
        background-size: cover;
        background-position: center;
        background-attachment: fixed;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
      }

      .container {
        background: rgba(255, 255, 255, 0.9);
        border-radius: 20px;
        padding: 40px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        width: 100%;
        max-width: 1400px;
        position: relative;
        overflow: hidden;
      }

      /* Floating balloons background */
      .floating-bg-balloon {
        position: absolute;
        background-image: url("miffyballoon.jpg");
        background-size: cover;
        background-position: center;
        border-radius: 50% 50% 50% 45%;
        opacity: 0.15;
        pointer-events: none;
        animation: float-bg-balloon 8s ease-in-out infinite;
      }

      .bg-balloon1 {
        width: 100px;
        height: 130px;
        top: 5%;
        left: 3%;
        animation-delay: 0s;
        transform: rotate(-20deg);
      }

      .bg-balloon2 {
        width: 120px;
        height: 160px;
        top: 15%;
        right: 5%;
        animation-delay: 2s;
        transform: rotate(15deg);
      }

      .bg-balloon3 {
        width: 90px;
        height: 120px;
        bottom: 20%;
        left: 8%;
        animation-delay: 1s;
        transform: rotate(-15deg);
      }

      .bg-balloon4 {
        width: 110px;
        height: 145px;
        bottom: 10%;
        right: 6%;
        animation-delay: 3s;
        transform: rotate(25deg);
      }

      .bg-balloon5 {
        width: 95px;
        height: 125px;
        top: 50%;
        right: 2%;
        animation-delay: 1.5s;
        transform: rotate(-10deg);
      }

      @keyframes float-bg-balloon {
        0%,
        100% {
          transform: translateY(0px) translateX(0px) rotate(-20deg);
        }
        50% {
          transform: translateY(-40px) translateX(20px) rotate(-20deg);
        }
      }

      .bg-balloon2 {
        animation: float-bg-balloon2 8s ease-in-out infinite;
      }

      @keyframes float-bg-balloon2 {
        0%,
        100% {
          transform: translateY(0px) translateX(0px) rotate(15deg);
        }
        50% {
          transform: translateY(-50px) translateX(-25px) rotate(15deg);
        }
      }

      .bg-balloon3 {
        animation: float-bg-balloon3 8s ease-in-out infinite;
      }

      @keyframes float-bg-balloon3 {
        0%,
        100% {
          transform: translateY(0px) translateX(0px) rotate(-15deg);
        }
        50% {
          transform: translateY(-35px) translateX(15px) rotate(-15deg);
        }
      }

      .bg-balloon4 {
        animation: float-bg-balloon4 8s ease-in-out infinite;
      }

      @keyframes float-bg-balloon4 {
        0%,
        100% {
          transform: translateY(0px) translateX(0px) rotate(25deg);
        }
        50% {
          transform: translateY(-45px) translateX(-30px) rotate(25deg);
        }
      }

      .bg-balloon5 {
        animation: float-bg-balloon5 8s ease-in-out infinite;
      }

      @keyframes float-bg-balloon5 {
        0%,
        100% {
          transform: translateY(0px) translateX(0px) rotate(-10deg);
        }
        50% {
          transform: translateY(-38px) translateX(25px) rotate(-10deg);
        }
      }

      h1 {
        text-align: center;
        margin-bottom: 40px;
        color: #333;
        width: 100%;
        position: relative;
        z-index: 10;
      }

      .toys-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 30px;
        width: 100%;
        position: relative;
        z-index: 20;
      }

      .fidget-item {
        text-align: center;
        padding: 20px;
        background: #f9f9f9;
        border-radius: 15px;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
      }

      .fidget-item h2 {
        font-size: 18px;
        margin-bottom: 15px;
        color: #555;
      }

      /* Spinner */
      .spinner {
        width: 150px;
        height: 150px;
        margin: 0 auto 20px;
        background-image: url("miffy.jpg");
        background-size: cover;
        background-position: center;
        border-radius: 50%;
        cursor: pointer;
        transition: transform 0.1s;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        overflow: hidden;
      }

      .spinner:hover {
        transform: scale(1.05);
      }

      .spinner.spinning {
        animation: spin 2s linear infinite;
      }

      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }

      /* Pop It */
      .pop-it {
        display: grid;
        grid-template-columns: repeat(4, 50px);
        gap: 8px;
        margin: 0 auto 20px;
        width: fit-content;
      }

      .bubble {
        width: 50px;
        height: 50px;
        background-image: url("miffypop.jpg");
        background-size: cover;
        background-position: center;
        border: 2px solid #ddd;
        border-radius: 50%;
        cursor: pointer;
        transition: all 0.2s;
        box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.2);
      }

      .bubble:hover {
        transform: scale(1.05);
      }

      .bubble.popped {
        background-image: none;
        background: #ddd;
        transform: scale(0.95);
        box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.5);
      }

      /* Floating Balloon */
      .balloon-container {
        width: 280px;
        height: 280px;
        margin: 0 auto 20px;
        background: #1a1a2e;
        border-radius: 15px;
        position: relative;
        overflow: hidden;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 30px;
        padding: 40px 20px;
      }

      .floating-balloon {
        width: 60px;
        height: 80px;
        background-image: url("miffyballoon.jpg");
        background-size: cover;
        background-position: center;
        border-radius: 50% 50% 50% 45%;
        cursor: pointer;
        transition: transform 0.2s;
        position: relative;
        box-shadow:
          -5px 5px 15px rgba(0, 0, 0, 0.4),
          inset -3px -3px 8px rgba(0, 0, 0, 0.2);
        animation: float 2s ease-in-out infinite;
        flex-shrink: 0;
      }

      .floating-balloon::before {
        content: "";
        position: absolute;
        width: 2px;
        height: 25px;
        background: rgba(200, 200, 200, 0.6);
        bottom: -25px;
        left: 50%;
        transform: translateX(-50%);
      }

      .floating-balloon::after {
        content: "";
        position: absolute;
        width: 6px;
        height: 6px;
        background: rgba(100, 100, 100, 0.7);
        bottom: -27px;
        left: 50%;
        transform: translateX(-50%);
        border-radius: 50%;
        opacity: 0.7;
      }

      .floating-balloon:hover {
        transform: scale(1.1);
      }

      .floating-balloon.popped {
        opacity: 0;
        transform: scale(0);
        animation: none;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-15px);
        }
      }

      .floating-balloon.yellow {
        animation-delay: 0s;
      }

      .floating-balloon.red {
        animation-delay: 0.2s;
      }

      .floating-balloon.green {
        animation-delay: 0.4s;
      }

      /* Clicker */
      .clicker {
        width: 120px;
        height: 120px;
        margin: 0 auto 20px;
        background-image: url("miffyclicker.jpg");
        background-size: cover;
        background-position: center;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: all 0.1s;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      }

      .clicker:hover {
        transform: scale(1.05);
      }

      .clicker:active {
        transform: scale(0.95);
      }

      /* Squeeze Ball */
      .squeeze-ball {
        width: 120px;
        height: 120px;
        margin: 0 auto 20px;
        background-image: url("miffysqueeze.jpg");
        background-size: cover;
        background-position: center;
        border-radius: 50%;
        cursor: pointer;
        transition: all 0.05s;
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
      }

      .squeeze-ball:active {
        transform: scale(0.85);
        box-shadow: inset 0 5px 15px rgba(0, 0, 0, 0.3);
      }

      /* Bubble Wrap */
      .bubble-wrap {
        display: grid;
        grid-template-columns: repeat(3, 40px);
        gap: 6px;
        margin: 0 auto 20px;
        width: fit-content;
        background: linear-gradient(135deg, #e0e0e0, #f5f5f5);
        padding: 15px;
        border-radius: 10px;
      }

      .wrap-bubble {
        width: 40px;
        height: 40px;
        background: radial-gradient(circle at 30% 30%, #ffffff, #cccccc);
        border-radius: 50%;
        cursor: pointer;
        transition: all 0.1s;
        box-shadow:
          inset -2px -2px 5px rgba(0, 0, 0, 0.2),
          2px 2px 5px rgba(0, 0, 0, 0.1);
      }

      .wrap-bubble:active {
        box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.3);
        background: radial-gradient(circle at 30% 30%, #f0f0f0, #a0a0a0);
      }

      /* Stress Ball */
      .stress-ball {
        width: 100px;
        height: 100px;
        margin: 0 auto 20px;
        background: linear-gradient(135deg, #ff6b9d, #ff8e8e);
        border-radius: 50%;
        cursor: pointer;
        transition: all 0.05s;
        box-shadow: 0 8px 20px rgba(255, 107, 157, 0.3);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 40px;
      }

      .stress-ball:active {
        transform: scale(0.9);
        box-shadow:
          inset 0 5px 15px rgba(0, 0, 0, 0.2),
          0 2px 5px rgba(255, 107, 157, 0.3);
      }

      /* Fidget Cube */
      .fidget-cube {
        width: 120px;
        height: 120px;
        margin: 0 auto 20px;
        background: linear-gradient(
          135deg,
          #667eea 0%,
          #764ba2 50%,
          #f093fb 100%
        );
        border-radius: 15px;
        cursor: pointer;
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 3px;
        padding: 8px;
        box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        transition: all 0.1s;
      }

      .cube-face {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.1s;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
      }

      .cube-face:hover {
        background: rgba(255, 255, 255, 0.4);
        transform: scale(1.05);
      }

      .cube-face:active {
        transform: scale(0.95);
        background: rgba(255, 255, 255, 0.6);
      }

      /* Infinity Cube */
      .infinity-cube {
        width: 120px;
        height: 120px;
        margin: 0 auto 20px;
        background: linear-gradient(45deg, #00d4ff, #0099ff, #6a0572, #ab00ff);
        border-radius: 8px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.1s;
        box-shadow: 0 8px 25px rgba(0, 212, 255, 0.3);
        font-size: 50px;
      }

      .infinity-cube:active {
        transform: rotateX(10deg) rotateY(10deg);
        box-shadow: 0 12px 35px rgba(0, 212, 255, 0.5);
      }

      p {
        font-size: 18px;
        color: #555;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Floating balloons background -->
      <div class="floating-bg-balloon bg-balloon1"></div>
      <div class="floating-bg-balloon bg-balloon2"></div>
      <div class="floating-bg-balloon bg-balloon3"></div>
      <div class="floating-bg-balloon bg-balloon4"></div>
      <div class="floating-bg-balloon bg-balloon5"></div>

      <h1>🎮 Miffy Fidget</h1>
      <div class="toys-grid">
        <!-- Spinner -->
        <div class="fidget-item">
          <h2>Spinner</h2>
          <div class="spinner" id="spinner"></div>
          <p>Click to spin!</p>
        </div>

        <!-- Pop It -->
        <div class="fidget-item">
          <h2>Pop It</h2>
          <div class="pop-it" id="popIt"></div>
          <p>Pop the bubbles!</p>
        </div>

        <!-- Floating Balloon -->
        <div class="fidget-item">
          <h2>Floating Balloon</h2>
          <div class="balloon-container" id="balloonContainer"></div>
          <p>Pop the balloons!</p>
        </div>

        <!-- Clicker -->
        <div class="fidget-item">
          <h2>Clicker</h2>
          <div class="clicker" id="clicker"></div>
          <p>Clicks: <span id="clickCount">0</span></p>
        </div>

        <!-- Squeeze Ball -->
        <div class="fidget-item">
          <h2>Squeeze Ball</h2>
          <div class="squeeze-ball" id="squeezeBall"></div>
          <p>Squeeze away!</p>
        </div>

        <!-- Bubble Wrap -->
        <div class="fidget-item">
          <h2>Bubble Wrap</h2>
          <div class="bubble-wrap" id="bubbleWrap"></div>
          <p>Pop all 9!</p>
        </div>

        <!-- Stress Ball -->
        <div class="fidget-item">
          <h2>Stress Ball</h2>
          <div class="stress-ball" id="stressBall">💪</div>
          <p>Squeeze & release!</p>
        </div>

        <!-- Fidget Cube -->
        <div class="fidget-item">
          <h2>Fidget Cube</h2>
          <div class="fidget-cube" id="fidgetCube">
            <div class="cube-face">🔴</div>
            <div class="cube-face">🟢</div>
            <div class="cube-face">🟡</div>
            <div class="cube-face">🔵</div>
          </div>
          <p>Click the sides!</p>
        </div>

        <!-- Infinity Cube -->
        <div class="fidget-item">
          <h2>Infinity Cube</h2>
          <div class="infinity-cube" id="infinityCube">♾️</div>
          <p>Flip & rotate!</p>
        </div>
      </div>
    </div>

    <script>
      // Spinner
      const spinner = document.getElementById("spinner");
      spinner.addEventListener("click", function () {
        spinner.classList.add("spinning");
        setTimeout(() => {
          spinner.classList.remove("spinning");
        }, 2000);
      });

      // Pop It
      const popIt = document.getElementById("popIt");
      for (let i = 0; i < 16; i++) {
        const bubble = document.createElement("div");
        bubble.classList.add("bubble");
        bubble.addEventListener("click", function (e) {
          e.stopPropagation();
          bubble.classList.toggle("popped");
        });
        popIt.appendChild(bubble);
      }

      // Floating Balloon
      const balloonContainer = document.getElementById("balloonContainer");
      const balloonColors = ["yellow", "red", "green"];

      function createAllBalloons() {
        balloonContainer.innerHTML = "";
        balloonColors.forEach((color) => {
          const balloon = document.createElement("div");
          balloon.className = `floating-balloon ${color}`;

          balloon.addEventListener("click", function (e) {
            e.stopPropagation();
            balloon.classList.add("popped");
            playPop();
            setTimeout(() => {
              createAllBalloons();
            }, 400);
          });

          balloonContainer.appendChild(balloon);
        });
      }

      createAllBalloons();

      // Clicker
      let clickCount = 0;
      const clicker = document.getElementById("clicker");
      const clickCountDisplay = document.getElementById("clickCount");
      clicker.addEventListener("click", function () {
        clickCount++;
        clickCountDisplay.textContent = clickCount;
      });

      // Squeeze Ball
      const squeezeBall = document.getElementById("squeezeBall");
      squeezeBall.addEventListener("click", function () {
        playPop();
      });

      // Bubble Wrap
      const bubbleWrap = document.getElementById("bubbleWrap");
      for (let i = 0; i < 9; i++) {
        const wrapBubble = document.createElement("div");
        wrapBubble.classList.add("wrap-bubble");
        wrapBubble.addEventListener("click", function (e) {
          e.stopPropagation();
          playPop();
          wrapBubble.style.opacity = "0.5";
          setTimeout(() => {
            wrapBubble.style.opacity = "1";
          }, 300);
        });
        bubbleWrap.appendChild(wrapBubble);
      }

      // Fidget Cube
      const cubeFaces = document.querySelectorAll(".cube-face");
      cubeFaces.forEach((face) => {
        face.addEventListener("click", function () {
          playPop();
        });
      });

      // Infinity Cube
      const infinityCube = document.getElementById("infinityCube");
      infinityCube.addEventListener("click", function () {
        playPop();
      });

      // Proper balloon pop sound effect
      function playPop() {
        const audioContext = new (
          window.AudioContext || window.webkitAudioContext
        )();
        const now = audioContext.currentTime;

        // Create a noise buffer
        const bufferSize = audioContext.sampleRate * 0.5;
        const noiseBuffer = audioContext.createBuffer(
          1,
          bufferSize,
          audioContext.sampleRate,
        );
        const output = noiseBuffer.getChannelData(0);

        for (let i = 0; i < bufferSize; i++) {
          output[i] = Math.random() * 2 - 1;
        }

        // Create noise source
        const noiseSource = audioContext.createBufferSource();
        noiseSource.buffer = noiseBuffer;

        // Create filter for pop effect
        const filter = audioContext.createBiquadFilter();
        filter.type = "highpass";
        filter.frequency.setValueAtTime(2000, now);
        filter.frequency.exponentialRampToValueAtTime(200, now + 0.2);

        // Create gain for volume
        const gain = audioContext.createGain();
        gain.gain.setValueAtTime(0.5, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);

        // Connect nodes
        noiseSource.connect(filter);
        filter.connect(gain);
        gain.connect(audioContext.destination);

        // Play
        noiseSource.start(now);
        noiseSource.stop(now + 0.2);
      }

      // Reset button (press 'r' key)
      document.addEventListener("keydown", function (e) {
        if (e.key === "r" || e.key === "R") {
          clickCount = 0;
          clickCountDisplay.textContent = "0";
          document
            .querySelectorAll(".bubble")
            .forEach((b) => b.classList.remove("popped"));
          document
            .querySelectorAll(".floating-balloon")
            .forEach((b) => b.remove());
          document
            .querySelectorAll(".wrap-bubble")
            .forEach((b) => (b.style.opacity = "1"));
          createAllBalloons();
        }
      });
    </script>
  </body>
</html>
